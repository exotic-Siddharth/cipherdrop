# CI (docs/DESIGN.md section 14): lint + typecheck + unit; integration with Postgres and Redis services plus MinIO
# for the S3 driver; Playwright e2e with the report uploaded on failure; a build-only check of the production images.
#
# The services are published on the SAME host ports as docker-compose.yml (Postgres 55433, Redis 56380, MinIO 59000)
# so the test and e2e configs run unchanged: their defaults and playwright.config.ts point at those ports.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '22'

jobs:
  static:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit tests that need no services: the crypto and shared packages and the SPA (jsdom).
      - run: npm test -w @cipherdrop/crypto -w @cipherdrop/shared -w @cipherdrop/web

  integration:
    name: integration (postgres, redis, minio)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipherdrop
          POSTGRES_PASSWORD: cipherdrop
          POSTGRES_DB: cipherdrop
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U cipherdrop -d cipherdrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The test setup creates cipherdrop_test and applies every migration itself.
      - name: API integration tests (real Postgres and Redis, local storage)
        run: npm test -w @cipherdrop/api
      # MinIO is not a service container: its image needs a command (server /data), which `services:` cannot pass.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 59000:9000 \
            -e MINIO_ROOT_USER=cipherdrop -e MINIO_ROOT_PASSWORD=cipherdrop-dev-secret \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:59000/minio/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs minio
          echo "MinIO did not become ready" >&2
          exit 1
      - name: Storage driver contract tests against MinIO
        run: npm run test:s3

  e2e:
    name: e2e (playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipherdrop
          POSTGRES_PASSWORD: cipherdrop
          POSTGRES_DB: cipherdrop
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U cipherdrop -d cipherdrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run e2e:install -w @cipherdrop/web -- --with-deps
      # The e2e API is a real process: it reads apps/api/.env like a fresh clone does (the example holds
      # dev-only values; the unit and integration jobs use their test defaults).
      - name: Use the example environment
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env
      # playwright.config.ts builds the SPA, serves it with `vite preview` (production headers, CSP on), starts the
      # API on cipherdrop_e2e and runs every spec in apps/web/e2e.
      - run: npm run e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

  images:
    name: production images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
