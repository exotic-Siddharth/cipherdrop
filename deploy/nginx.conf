# CipherDrop web server (spec sections 12 and 16): the SPA, the section 12 security headers and the /api proxy.
# Baked into the web image as /etc/nginx/conf.d/cipherdrop.conf (included inside nginx's http{} block).
#
# The header list mirrors apps/web/securityHeaders.ts (the headers `vite preview` sends in e2e). A unit test
# (apps/web/deploy-checks/nginx-headers.test.ts) fails when the two drift apart.
#
# Compose-specific lines: `resolver 127.0.0.11` is Docker's embedded DNS, `api:4100` the compose service name and
# 172.16.94.2 the fixed address of the caddy service (profile tls) on the compose network `edge`. Outside Docker,
# point `set $api_upstream` at the API, replace the resolver (or use a plain upstream block) and list your own TLS
# proxy in set_real_ip_from.

# In-flight /api requests through this nginx, all clients together. One API process holds at most 64 chunk PUTs
# plus 192 chunk GETs (MAX_CONCURRENT_CHUNK_UPLOADS / _DOWNLOADS), so 400 leaves room for ordinary requests.
# With N API instances behind this nginx raise it to about 400 * N. See docs/DEPLOYMENT.md (review point C-15).
limit_conn_zone $server_name zone=api_total:64k;

# In-flight /api requests per client, keyed like the API's per-IP in-flight shares (ipShareKey, C-R3-03): an IPv4
# address, or the first 6 bytes (the /48) of an IPv6 address, so that rotating addresses inside one delegated prefix
# does not multiply the allowance. An IPv4-mapped IPv6 address counts as its IPv4 address. An entry lives only while
# its client has a request in flight (at most about 400 at a time); 1 MB holds about 16,000.
map $binary_remote_addr $api_client {
    "~^\x00{10}\xff\xff(?<v4mapped>[\s\S]{4})$"  $v4mapped;
    "~^(?<v6net>[\s\S]{6})[\s\S]{10}$"           $v6net;
    default                                      $binary_remote_addr;
}
limit_conn_zone $api_client zone=api_ip:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: re-resolve `api` per request, so a recreated API container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Server level, so that the /api location and the chunk location nested in it use the same upstream (the rewrite
    # module's `set` in a location is not inherited by the locations nested in it).
    set $api_upstream http://api:4100;

    # The real client behind the bundled Caddy (profile tls), which replaces any X-Forwarded-For a client sends with
    # the address it saw. Only Caddy's fixed address on the compose network `edge` is trusted (docker-compose.prod.yml;
    # the unit test keeps the two equal). Never a private range: with Docker's userland proxy, direct clients reach
    # this container from a bridge gateway address, and their own X-Forwarded-For would then be believed. Without
    # this, every client behind Caddy would share Caddy's address in the per-client cap below. A proxy of your own in
    # front of nginx goes on a line of its own, by its exact address (see TRUST_PROXY in .env.production.example).
    set_real_ip_from 172.16.94.2;
    real_ip_header X-Forwarded-For;

    # Slow clients. nginx counts a connection against limit_conn only once its request header is complete, so the
    # header deadline is what bounds a slowloris before that point: browsers send the whole header at once, 10 s is
    # ample. An idle keep-alive connection holds a worker connection too, so it gets about as long (Caddy closes its
    # idle upstream connections first, deploy/Caddyfile). A timed-out connection is reset instead of lingering in
    # FIN_WAIT with full socket buffers.
    client_header_timeout 10s;
    keepalive_timeout 15s;
    reset_timedout_connection on;

    # Section 12 headers. `always` also covers 4xx/5xx. No location below may add its own add_header: nginx would then
    # drop every header inherited from this level (the /api location is the one deliberate exception).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # Trusted Types, report-only (securityHeaders.ts TRUSTED_TYPES_REPORT_ONLY; /trusted-types.js is the policy).
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Static types only: never application/json (compressing API responses that mix secrets and attacker-chosen
    # text is the BREACH setup) and never ciphertext.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml;

    # Liveness of this container only; the API's /healthz and /readyz are not exposed publicly.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Operational endpoints stay inside the Docker network (the compose healthcheck calls the API's /readyz directly;
    # scrape /metrics at api:4100). Without this they would fall through to the SPA and answer 200 with index.html.
    location ~ ^/(readyz|metrics)$ {
        return 404;
    }

    # Swagger UI never runs on this origin, which holds the vault key, drop keys and the refresh cookie. The API mounts
    # it only with API_DOCS_UI=true, which it refuses in production; this is the second safeguard, so a misconfigured
    # API still cannot serve it here. /api/openapi.json (plain JSON) is proxied as usual. No add_header: the 404 keeps
    # the server-level headers.
    location ^~ /api/docs {
        return 404;
    }

    # The API. The path is passed through unchanged (variable proxy_pass without a URI part).
    location /api/ {
        # Ordinary requests: JSON bodies of at most 1 MB (the API's express.json limit), which nginx reads in full
        # before the API sees them. Up to 128 KiB stay in memory: the largest body the SPA sends is a drop's 64 KiB
        # encrypted manifest plus its file list, so only bodies no honest client sends reach the client_temp tmpfs
        # (sized in docker-compose.prod.yml). client_body_timeout is the gap between two reads, not a deadline: 15 s
        # rides out TCP retransmission backoff (1 + 2 + 4 + 8 s) yet frees a stalled client's slot soon, while a body
        # dripped a byte at a time can only be bounded by the per-client cap below (nginx has no body deadline).
        client_max_body_size 1m;
        client_body_buffer_size 128k;
        client_body_timeout 15s;
        # Per client: the API's own per-IP shares are 16 chunk PUTs + 32 chunk GETs per process
        # (MAX_CHUNK_UPLOADS_PER_IP / MAX_CHUNK_DOWNLOADS_PER_IP), plus 16 for ordinary requests (a tab has a few in
        # flight, a NAT more). So honest transfers are still throttled by the API, with its 429 and Retry-After, and
        # nginx only stops a client that opens far more; without it one client could hold all 400 slots with
        # request bodies sent a byte at a time. With N API instances behind this nginx use 48 * N + 16.
        limit_conn api_ip 64;
        limit_conn api_total 400;
        limit_conn_status 429;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the client address nginx resolved (behind Caddy: the real client, set_real_ip_from above) to any
        # X-Forwarded-For the client or Caddy sent, so the last entry is always nginx's own and TRUST_PROXY=1 is right
        # with or without Caddy. Only a proxy in front of nginx that set_real_ip_from does not list needs a second hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Responses are buffered in memory (proxy_buffers) but never spooled to the tmpfs: past those buffers a slow
        # reader of a large JSON response is fed at its own pace from the API connection instead.
        proxy_max_temp_file_size 0;

        # Deliberate exception to the rule above. The API already sends helmet's CSP, Referrer-Policy,
        # nosniff and COOP/CORP on every response, so only the two headers helmet lacks or sets weaker are
        # set here, and the API's own HSTS (max-age 15552000) is replaced by the same 2-year value as the SPA.
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Chunk transfers: PUT and GET /api/drops/:id/files/:fileId/chunks/:index (the API's CHUNK_PATH_RE). Streamed
        # both ways, so the API's own defences act on the real client: auth before the body (an unverified uploader
        # is answered at once, and nginx discards the rest of its body for at most lingering_time, 30 s), the per-IP
        # and per-token shares, the 30 s idle timeout and the 4,096 B/s minimum rate of upload bodies (C-R2-02,
        # C-R3-01), and the idle timeout of downloads (CHUNK_IDLE_TIMEOUT_SEC). Buffered, nginx would accept a dripped
        # 4 MiB body on the API's behalf and spool every 4 MiB response a slow reader leaves behind.
        # Everything else comes from /api/: both limit_conn caps, the proxy headers and, because this block declares no
        # add_header, exactly the same response headers (one add_header here would drop all the inherited ones).
        location ~ ^/api/drops/[^/]+/files/[^/]+/chunks/[^/]+/?$ {
            # A chunk PUT is CHUNK_SIZE + 16 = 4 MiB + 16 bytes; the API checks the exact size.
            client_max_body_size 5m;
            # A backstop: the API hangs up a body that is idle for CHUNK_UPLOAD_IDLE_TIMEOUT_SEC (30 s) first.
            client_body_timeout 60s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass $api_upstream;
        }
    }

    # Content-hashed build output: cache for a year. A missing hashed file must be a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The threat model (docs/SECURITY.md, copied into the build by apps/web/vite.config.ts), linked from
    # /how-it-works. nginx has no type for .md and would send application/octet-stream (a download), so plain text.
    location = /SECURITY.md {
        types { }
        default_type text/plain;
        charset utf-8;
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback (/d/<id>, /login, ...). index.html and the unhashed root files (theme-init.js, favicon.svg)
    # are revalidated on every load (`expires -1` sends Cache-Control: no-cache), so a deploy takes effect at once.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
