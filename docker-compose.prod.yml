# CipherDrop production stack (spec section 16): postgres, redis, api, web (nginx), plus optional minio and caddy.
#
#   cp .env.production.example .env.production      # then fill in every value (see the comments in that file)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Optional profiles:   --profile minio   S3-compatible storage in this stack (STORAGE_DRIVER=s3, S3_ENDPOINT=http://minio:9000)
#                      --profile tls     Caddy terminates HTTPS on 80/443 (also set SITE_ADDRESS; TRUST_PROXY=1, not 2)
# Nothing but the web port (and Caddy's 80/443 with the tls profile) is published. The dev stack is docker-compose.yml.
name: cipherdrop-prod

# Container logs (nginx's access log with IP prefixes only, the API's request log): Docker's json-file driver keeps at
# most 3 files of 10 MB per container, so retention is bounded by size, not time. A privacy-format nginx line takes
# about 200 bytes on disk (Docker's JSON wrapper included), so 30 MB holds some 150,000 requests: days on a busy
# instance, months on a quiet one. For a time limit, use the journald driver with MaxRetentionSec= in the host's
# journald.conf, or ship the logs to a store that expires them (docs/DEPLOYMENT.md).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cipherdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: cipherdrop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cipherdrop -d cipherdrop']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Redis holds rate-limit counters, the revoked-session denylist and cleanup locks. The denylist is what makes a
  # password change or "revoke session" effective at once, so it is persisted (AOF) and survives a restart.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: cipherdrop-api:${IMAGE_TAG:-latest}
    # Every API setting comes from .env.production (docs/DEPLOYMENT.md); the values below are fixed by this
    # stack's topology and take precedence over the file.
    env_file: ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      API_PORT: '4100'
      DATABASE_URL: postgresql://cipherdrop:${POSTGRES_PASSWORD}@postgres:5432/cipherdrop?schema=public
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STORAGE_DIR: /data/blobs
    volumes:
      - blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness (database, Redis and blob storage), unlike the image's liveness-only HEALTHCHECK.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/readyz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Written into /.well-known/security.txt at build time (rebuild to change them, and at least every 180 days,
      # when its Expires passes). Unset: the CipherDrop project's private vulnerability reporting on GitHub.
      args:
        SECURITY_TXT_CONTACT: ${SECURITY_TXT_CONTACT:-}
        SECURITY_TXT_POLICY: ${SECURITY_TXT_POLICY:-}
    image: cipherdrop-web:${IMAGE_TAG:-latest}
    ports:
      # Loopback by default: put TLS in front (Caddy profile, or a host-level proxy). Use WEB_BIND=0.0.0.0 to expose it.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    read_only: true
    # Sized, so that what clients make nginx hold in RAM is bounded. /var/cache/nginx holds client_temp: JSON bodies
    # between 128 KiB (client_body_buffer_size, kept in memory) and 1 MiB, which the SPA never sends; chunk bodies are
    # streamed and responses are never spooled (deploy/nginx.conf). One client can fill 64 MiB at most (64 requests),
    # and a full tmpfs fails only such oversized bodies. /var/run holds the pid file; /tmp is unused.
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=1m
      - /tmp:size=1m
    networks: [default, edge]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Optional: S3-compatible storage in the stack (set S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY; empty values make MinIO
  # refuse to start). minio/minio left Docker Hub; the Chainguard image runs as uid 65532.
  minio:
    profiles: [minio]
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: *logging

  # Optional: automatic HTTPS in front of nginx (set SITE_ADDRESS; an empty value makes Caddy refuse the config).
  # Only on `edge`, at a fixed address: nginx takes the client address from X-Forwarded-For of this one address
  # (set_real_ip_from in deploy/nginx.conf), so the API and nginx's per-client cap see the real client.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.16.94.2
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    logging: *logging

networks:
  # Caddy and nginx. A fixed subnet, so that Caddy's address is known in advance; containers without a fixed address
  # (web) get theirs from ip_range, which leaves 172.16.94.2 free for Caddy. The subnet must not overlap another
  # Docker network on the host: to move it, change it here and in set_real_ip_from (the unit test checks both).
  edge:
    ipam:
      config:
        - subnet: 172.16.94.0/28
          ip_range: 172.16.94.8/29
          gateway: 172.16.94.1

volumes:
  postgres-data:
  redis-data:
  blobs:
  minio-data:
  caddy-data:
  caddy-config:
