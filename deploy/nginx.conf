# CipherDrop web server (spec sections 12 and 16): the SPA, the section 12 security headers and the /api proxy.
# Baked into the web image as /etc/nginx/conf.d/cipherdrop.conf (included inside nginx's http{} block).
#
# The header list mirrors apps/web/securityHeaders.ts (the headers `vite preview` sends in e2e). A unit test
# (apps/web/test/nginx-headers.test.ts) fails when the two drift apart.
#
# Compose-specific lines: `resolver 127.0.0.11` is Docker's embedded DNS and `api:4100` the compose service name.
# Outside Docker, point `set $api_upstream` at the API and replace the resolver (or use a plain upstream block).

# In-flight /api requests through this nginx, all clients together. One API process holds at most 64 chunk PUTs
# plus 192 chunk GETs (MAX_CONCURRENT_CHUNK_UPLOADS / _DOWNLOADS), so 400 leaves room for ordinary requests.
# With N API instances behind this nginx raise it to about 400 * N. See docs/DEPLOYMENT.md (review point C-15).
limit_conn_zone $server_name zone=api_total:64k;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: re-resolve `api` per request, so a recreated API container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Section 12 headers. `always` also covers 4xx/5xx. No location below may add its own add_header: nginx would then
    # drop every header inherited from this level (the /api location is the one deliberate exception).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Static types only: never application/json (compressing API responses that mix secrets and attacker-chosen
    # text is the BREACH setup) and never ciphertext.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml;

    # Liveness of this container only; the API's /healthz and /readyz are not exposed publicly.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Operational endpoints stay inside the Docker network (the compose healthcheck calls the API's /readyz directly;
    # scrape /metrics at api:4100). Without this they would fall through to the SPA and answer 200 with index.html.
    location ~ ^/(readyz|metrics)$ {
        return 404;
    }

    # The API. The path is passed through unchanged (variable proxy_pass without a URI part).
    location /api/ {
        # Chunk PUTs are CHUNK_SIZE + 16 = 4 MiB + 16 bytes, JSON bodies at most 1 MB.
        client_max_body_size 5m;
        client_body_timeout 60s;
        limit_conn api_total 400;
        limit_conn_status 429;

        set $api_upstream http://api:4100;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the address nginx saw to any X-Forwarded-For sent by the client or by an outer proxy:
        # TRUST_PROXY must count the hops (1 = nginx only, 2 = Caddy or another proxy in front of nginx).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Deliberate exception to the rule above. The API already sends helmet's CSP, Referrer-Policy,
        # nosniff and COOP/CORP on every response, so only the two headers helmet lacks or sets weaker are
        # set here, and the API's own HSTS (max-age 15552000) is replaced by the same 2-year value as the SPA.
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Content-hashed build output: cache for a year. A missing hashed file must be a 404, never index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback (/d/<id>, /login, ...). index.html and the unhashed root files (theme-init.js, favicon.svg)
    # are revalidated on every load (`expires -1` sends Cache-Control: no-cache), so a deploy takes effect at once.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
